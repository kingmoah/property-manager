version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: property-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: property_manager
      POSTGRES_USER: property_user
      POSTGRES_PASSWORD: property_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: property-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: property-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    environment:
      DATABASE_URL: postgresql://property_user:property_password@postgres:5432/property_manager
      OLLAMA_URL: http://ollama:11434
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: property-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  ollama_data: